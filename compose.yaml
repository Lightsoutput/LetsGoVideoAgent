name: lets-go-video-agent

# 后端三个进程复用同一镜像：迁移、HTTP API 与 Temporal Worker。
# 业务代码仍是模块化单体，避免 P0 阶段为了“看起来复杂”而过早拆分微服务。
x-backend-image: &backend-image
  image: lets-go-video-agent-backend:${APP_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile

x-backend-environment: &backend-environment
  APP_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REPOSITORY_BACKEND: mysql
  WORKFLOW_BACKEND: temporal
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
  LOCAL_DATA_DIR: /app/data
  ENABLE_REMOTE_DOWNLOADS: ${ENABLE_REMOTE_DOWNLOADS:-false}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
  REDIS_URL: ${REDIS_URL:?REDIS_URL must be set in .env}
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-video_artifacts}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
  MINIO_BUCKET: ${MINIO_BUCKET:-video-agent}
  MINIO_SECURE: "false"
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-video-processing}
  MODEL_PROFILE: ${MODEL_PROFILE:-economy}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_MODEL: ${LLM_MODEL:-mock-evidence-model}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_API_BASE: ${LLM_API_BASE:-}
  VLM_PROVIDER: ${VLM_PROVIDER:-mock}
  VLM_MODEL: ${VLM_MODEL:-mock-vision-model}
  VLM_API_BASE: ${DOCKER_VLM_API_BASE:-http://host.docker.internal:11434}
  VLM_API_KEY: ${VLM_API_KEY:-}
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-disabled}
  SEARCH_API_BASE: ${DOCKER_SEARCH_API_BASE:-http://searxng:8080}
  SEARCH_MCP_URL: ${DOCKER_SEARCH_MCP_URL:-http://search-mcp:8090/mcp}
  AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-6}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-10}
  AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-12000}
  AGENT_MAX_COST_USD: ${AGENT_MAX_COST_USD:-0.10}
  AGENT_DEADLINE_SECONDS: ${AGENT_DEADLINE_SECONDS:-60}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

services:
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8888}:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    networks: [agent-network]

  search-mcp:
    <<: *backend-image
    restart: unless-stopped
    environment:
      SEARCH_API_BASE: http://searxng:8080
      SEARCH_MCP_HOST: 0.0.0.0
      SEARCH_MCP_PORT: "8090"
    command: ["video-agent-search-mcp"]
    ports:
      - "127.0.0.1:${SEARCH_MCP_HOST_PORT:-8090}:8090"
    depends_on:
      - searxng
    networks: [agent-network]

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lets_go_video_agent}
      MYSQL_USER: ${MYSQL_USER:-video_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 数据库和 Trace 统一 UTC，前端再按用户时区展示。
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [agent-network]

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [agent-network]

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant 镜像不保证内置 curl，使用 bash 的 TCP 能力完成轻量存活检查。
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [agent-network]

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [agent-network]

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-video-agent}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    networks: [agent-network]

  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/auto-setup:1.27.2}
    restart: unless-stopped
    environment:
      DB: mysql8
      DB_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_SEEDS: mysql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tctl --address 127.0.0.1:7233 cluster health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [agent-network]

  temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.34.0}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${WEB_HOST_PORT:-3000}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [agent-network]

  migrate:
    <<: *backend-image
    restart: "no"
    environment:
      <<: *backend-environment
      SEED_DEMO_DATA: "false"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [agent-network]

  api:
    <<: *backend-image
    restart: unless-stopped
    environment:
      <<: *backend-environment
    command: ["video-agent-api"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s
    networks: [agent-network]

  worker:
    <<: *backend-image
    restart: unless-stopped
    environment:
      <<: *backend-environment
      SEED_DEMO_DATA: "false"
    command: ["video-agent-worker"]
    volumes:
      - backend_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    healthcheck:
      # Temporal Worker 没有 HTTP 端口；PID 1 存活代表 worker 主循环仍在运行。
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    networks: [agent-network]

  frontend:
    image: lets-go-video-agent-frontend:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 20s
    networks: [agent-network]

networks:
  agent-network:
    driver: bridge

volumes:
  searxng_data:
  mysql_data:
  redis_data:
  qdrant_data:
  minio_data:
  backend_data:
